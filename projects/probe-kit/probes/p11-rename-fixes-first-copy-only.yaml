id: p11-rename-fixes-first-copy-only
title: 改名/替换只处理第一个命中的副本，自查又只复查那一个，其余副本带病通过
catches: [假绿, 静默跳过]
severity: high
deps: [bash, node]
inject: |
  mkdir -p <tmp>/root/worker
  printf '投放至 <投递箱> 箱。\n' > <tmp>/root/交接书A.md       # 副本 1（旧箱名）
  printf '回执发 <投递箱> 箱。\n' > <tmp>/root/worker/交接书B.md  # 副本 2（旧箱名）
  printf '投递箱: 新箱\n' > <tmp>/root/通用提示词.md                   # 本来就对的副本
  node <subject> --root <tmp>/root   # <subject>：扫描旧名→替换→自查的装置
  grep -rn '<投递箱>' <tmp>/root | wc -l    # 自证：旧箱名恰好 2 个副本（应＝2，判"漏改几处"的基准数）
run: |
  本库装置：node <tmp>/toys/p11-rename-first-copy-only.mjs（无参数；装置自建 .tmp-p11 夹具）
  通用：把多副本含旧名的目录喂给"扫描→替换→自查"装置；示例：node <你的装置> --root <tmp>/root
expect: |
  报警 = 装置对**全部**命中副本逐个替换并逐个复查：漏改几个就报几处，计数非 0 ⇒ 退出码非 0。
  漏   = 只改 wrong[0]、只复查那一个 ⇒ 输出"已改 1 个 ＋ OK 无漂移"、退出码 0，
         其余副本继续传播（历史实测：改名后活文档残留 7 处旧箱名，含会把错名复制进每个新包的模板）。
evidence: "grep 旧名 → 活文档 7 处（散布 5 份工作区文档；含规则汇总段第 7 条第 4 项），历史档案另有 3 处；修后 doc-drift-check → OK 无漂移（扫描 9 个文件）＋ exit 0"
source: P11
applies_to: [扫描→替换→自查类装置, 任何"同一事实多处维护"的一致性检查]
limits: 事实只有一处权威副本时不适用
verify:
  - target: 中立玩具装置
    ref: <tmp>/toys/p11-rename-first-copy-only.mjs
    cmd: node p11-rename-first-copy-only.mjs
    observed: "扫描 4 个文件，命中旧箱名 3 个副本，已改 1 个／OK 无漂移（复查范围: 交接书.md）／exit=0 —— 3 个命中只改 1 个，仍宣布无漂移"
    verdict: 漏
  - target: 本体工具
    ref: <repo>/tools/doc-drift-check/doc-drift-check.mjs
    cmd: node doc-drift-check.mjs --root <tmp>/ddc-p11/root     # 两个文件各一处旧箱名
    observed: "漂移: 2 处（扫描 2 个文件；查 0 条路径、0 处编号声明、疑似未识别 0 处）／- [R1] 交接书A.md:1 …／- [R1] worker/交接书B.md:1 …／exit=1 —— 逐文件逐行全扫，副本一个不漏"
    verdict: 报警
