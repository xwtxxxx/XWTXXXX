id: p23-flat-inbox-silent-collision
title: 平铺收件箱里前后两单同名文件：后一单静默顶替前一单，无重名检查无告警
catches: [假绿, 静默跳过]
severity: high
deps: [bash, node]
inject: |
  mkdir -p <tmp>/inbox
  printf '前一单 自测：上一单的正文\n' > <tmp>/前一单-test.mjs
  printf '后一单 自测：新一单的正文\n' > <tmp>/后一单-test.mjs    # 坏数据：两单同名件，先独立落盘
  cp <tmp>/前一单-test.mjs <tmp>/inbox/test.mjs    # 第一单落箱
  head -1 <tmp>/inbox/test.mjs                  # 自证①：第一单在场（前一单 自测：…）
  cp <tmp>/后一单-test.mjs <tmp>/inbox/test.mjs    # 第二单同名落箱（平铺，无人查重）
  head -1 <tmp>/inbox/test.mjs                  # 自证②：已被顶替成 后一单 —— 同名撞车真的会发生
  node <subject> <tmp>/inbox    # <subject>：往平铺"review"箱投放产出的装置（无重名检查地连投两单）

run: |
  本库装置：node <tmp>/toys/p23-flat-inbox-overwrite.mjs <tmp>/inbox（位置参数＝收件箱；装置把两单同名件先后投进去）
  通用：让投放装置把两单同名件先后投进同一平铺箱；示例：node <你的装置> <tmp>/inbox --order <tmp>/前一单-test.mjs，再投 <tmp>/后一单-test.mjs
expect: |
  报警 = 投放前查同名：目标已存在 ⇒ 停下报"同名冲突，勿覆盖"并计非 0（或按任务号分层存放）。
  漏   = 无重名检查、无告警：前一单 的 test.mjs（12645 B）/README.md（5494 B）被 后一单 的同名件
         （9981/4047 B）顶替，退出码 0——损失为 0 是因为权威副本已归档，属侥幸不是设计。
evidence: "review\\ 里 前一单 的 test.mjs 12645 B/README.md 5494 B 被 后一单 的 9981/4047 B 顶替；补齐后done\\前一单\\ 四件套字节＝归档副本；终态三态＝inbox 0／review 0／done 6"
source: P23
applies_to: [三态流转/收发件装置, 任何"平铺目录 ＋ 标配同名产出"的工作流]
limits: 目录按任务号分层、或"同一时刻只有一单"前置条件被机器强制时不适用
verify:
  - target: 中立玩具装置
    ref: <tmp>/toys/p23-flat-inbox-overwrite.mjs
    cmd: node p23-flat-inbox-overwrite.mjs <tmp>/inbox
    observed: "前一单 交付 -> test.mjs 219 B ／ README.md 59 B／后一单 交付 -> test.mjs 139 B ／ README.md 31 B／--- 收件方现在看到的箱子 ---／README.md  31 B  内容开头：后一单 说明：／test.mjs  139 B  内容开头：后一单 自测：／两单交付完成：无重名检查、无告警、exit 0／exit=0"
    verdict: 漏
  - target: 本体工具
    ref: 无对应本体
    cmd: （无对应本体可跑）
    observed: "8 件工具都是判据/编排器，没有一件负责产出的收发与归档流转——无对应本体"
    verdict: 不适用
