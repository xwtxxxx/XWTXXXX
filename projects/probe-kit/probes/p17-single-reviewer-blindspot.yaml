id: p17-single-reviewer-blindspot
title: 审查只跑一家口径：另一家才能看见的段位/形态整块漏掉，还宣布"审查通过"
catches: [假绿, 静默跳过]
severity: medium
deps: [bash, node]
inject: |
  mkdir -p <tmp>
  cat > <tmp>/doc.md <<'EOF'
  # 交接书
  #### M4 历史段
  旧箱名: <投递箱>
  ### P17 现状
  EOF
  node <subject> <tmp>/doc.md    # <subject>：按**一种**标题口径划定审查范围的装置
  # 对照：叠加第二口径（认 ##..#### 全级标题）再跑一遍
  grep -n '^####\|^###' <tmp>/doc.md    # 自证：#### 与 ### 两种标题级别都在场（漂移躺在 #### 段内）
run: |
  本库装置：node <tmp>/toys/p17-single-reviewer.mjs（缺省只跑甲口径；--both 叠加乙口径对照）
  通用：只给审查装置一种口径的输入，再叠加第二口径比对；示例：node <你的审查装置> <tmp>/doc.md --scope 甲口径，再换乙口径
expect: |
  报警 = 两家口径都跑（或明说只跑了一家、覆盖面多大）：漂移被任一口径发现 ⇒ 报出且非 0。
  漏   = 只认 ### 级 ⇒ #### 段内的漂移整块看不见 ⇒ 输出"漂移 0 处 ⇒ 审查通过"、退出码 0
         （历史实测：同题两审查员 4/4＋3/3 零幻觉，去重 5 条真缺陷里 2 条仅一方独有——
         单跑任何一家都拿不全）。
evidence: "审查员甲 4/4、审查员乙 3/3（逐条实测全部成立）；去重后 5 条真缺陷：2 条双方都发现、2 条审查员甲独有（编号区间不计数、裸旧箱名不报）、1 条审查员乙独有（历史段退出只认 ##/###，# 与 #### 级漏掉）"
source: P17
applies_to: [审查/审计类装置, 按标题级别/形态划定扫描范围的判据]
limits: 输入只有单一形态、两家口径覆盖面重合时不适用
verify:
  - target: 中立玩具装置
    ref: <tmp>/toys/p17-single-reviewer.mjs
    cmd: node p17-single-reviewer.mjs               # 默认只跑甲口径；--both 为对照
    observed: "甲口径(只认 ###)：漂移 0 处／本次审查结论：漂移 0 处 ⇒ 审查通过 (exit 0)／exit=0（--both 对照：乙口径漂移 1 处 ⇒ 不通过 exit 1 —— #### 段内的真实漂移被单口径整块漏掉）"
    verdict: 漏
  - target: 本体工具
    ref: 无对应本体
    cmd: （无对应本体可跑）
    observed: "8 件工具里没有『多审查员编排/A-B 对比』类本体——审查都由人或会话直接驱动，无对应本体"
    verdict: 不适用
