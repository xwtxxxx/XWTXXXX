id: p24-nested-selftest-never-runs
title: 产出是嵌套结构时子目录里的自测从未运行，检查却报"未找到"并当通过
catches: [静默跳过, 假绿]
severity: high
deps: [bash, node]
inject: |
  mkdir -p <tmp>/out/sub
  printf '# 交付\n' > <tmp>/out/README.md
  printf 'console.log("这条自测永远不会被跑");process.exit(1);\n' > <tmp>/out/sub/test.mjs
  node <subject> --dir <tmp>/out    # <subject>：找 test.mjs 并真跑它的验收装置
  ls -R <tmp>/out                        # 自证①：顶层只有 README.md，test.mjs 只在 sub/ 下
  node <tmp>/out/sub/test.mjs; echo "自证②：子目录自测 exit=$?（＝1，必败）"
run: |
  本库装置：node <tmp>/toys/p24-top-only-selftest.mjs <tmp>/out（位置参数＝产出目录）
  通用：把自测藏在子目录的产出目录喂给"找 test.mjs 真跑"的验收装置；示例：node <你的装置> --dir <tmp>/out
expect: |
  报警 = 递归找到子目录自测并明报"子目录自测未运行：sub/test.mjs"（计非 0），或直接递归跑它。
  漏   = 只报"自测 未找到 test.mjs"且退出码 0——子目录里那个**必然失败**的自测根本没被碰，
         "没查到"被当成"查过了没问题"（历史实测如此；修后 exit 1 ＋ 明报子目录自测未运行）。
evidence: "修前 --dir <嵌套> → 自测 未找到 test.mjs／exit 0；修后 → accept-kit: [自测] 子目录自测未运行：sub/test.mjs／exit 1（又一条实测，3/3 逐条复现成立）"
source: P24
applies_to: [找 test.mjs/测试入口的验收器, 任何"找不到＝放过"的检查逻辑]
limits: 产出恒为顶层平铺、且顶层必有自测时不适用
verify:
  - target: 中立玩具装置
    ref: <tmp>/toys/p24-top-only-selftest.mjs
    cmd: node p24-top-only-selftest.mjs <tmp>/out    # out/sub/test.mjs 必败，顶层无自测
    observed: "自测  未找到 test.mjs／扫描面：<tmp>/out（子目录 1 个：sub）／验收通过：exit 0／exit=0 —— 子目录里必败的自测从未被碰"
    verdict: 漏
  - target: 本体工具
    ref: <repo>/tools/验收台/accept-kit.mjs
    cmd: node accept-kit.mjs --dir <tmp>/out
    observed: "accept-kit: [自测] 子目录自测未运行：sub/test.mjs／…｜ 子目录自测未运行 1 ｜ 自测 未找到 test.mjs …／exit=1 —— 跳过的检查被明报并计非 0"
    verdict: 报警
